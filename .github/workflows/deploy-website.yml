name: Deploy Website Preview to Cloudflare Workers

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Deploy to docnote-website-preview-pr-N"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    name: Build & Deploy Preview

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set preview worker name
        id: preview-name
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::pr_number is required"
            exit 1
          fi
          BRANCH="${HEAD_REF:-$REF_NAME}"
          WORKER_NAME="docnote-website-preview-pr-${PR_NUMBER}"
          SITE_URL="https://${WORKER_NAME}.qualtir.workers.dev"
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Preview worker: $WORKER_NAME"
          echo "Site URL for build: $SITE_URL"

      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ steps.preview-name.outputs.site_url }}
          PUBLIC_IS_PREVIEW: "true"
        run: npm run build

      # Workers `wrangler deploy` fails if pages_build_output_dir is present (Pages project).
      - name: Remove Pages-only wrangler keys
        run: |
          node -e '
            const fs = require("fs");
            const p = "wrangler.jsonc";
            const j = JSON.parse(fs.readFileSync(p, "utf8").replace(/^\s*\/\/.*$/gm, ""));
            delete j.pages_build_output_dir;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '

      - name: Deploy Preview
        id: deploy-preview
        run: |
          set -o pipefail
          npx wrangler@latest deploy --name "${{ steps.preview-name.outputs.worker_name }}" 2>&1 | tee deploy.log
          PREVIEW_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | tail -1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="https://${{ steps.preview-name.outputs.worker_name }}.qualtir.workers.dev"
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.preview_url }}
          BRANCH: ${{ steps.preview-name.outputs.branch }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const branch = process.env.BRANCH;
            const body = `🚀 **Preview deployed!**\n\n` +
              `**Branch:** \`${branch}\`\n` +
              `**URL:** ${previewUrl}\n\n` +
              `This preview will be deleted automatically when the PR is closed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed!')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Cleanup Preview
    steps:
      - name: Delete preview worker
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_NAME="docnote-website-preview-pr-${PR_NUMBER}"
          echo "Deleting $WORKER_NAME"
          if ! npx wrangler@latest delete --name "$WORKER_NAME" --force; then
            echo "::warning::wrangler delete failed for $WORKER_NAME — worker may not exist, or the API call errored"
          fi
